
name: Collect exchange rates

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------------
      # Repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --------------------------------------------------------
      # BCN SSL Certificate
      # --------------------------------------------------------

      - name: Configure BCN SSL certificate
        run: |
          echo "=== Download DigiCert intermediate ==="

          curl --fail --silent --show-error \
            --output /tmp/bcn-intermediate.crt \
            https://cacerts.digicert.com/DigiCertGlobalG2TLSRSASHA2562020CA1-1.crt

          echo "=== Convert certificate to PEM ==="

          openssl x509 \
            -inform DER \
            -in /tmp/bcn-intermediate.crt \
            -out /tmp/bcn-intermediate.pem

          echo "=== Validate certificate identity ==="

          openssl x509 \
            -in /tmp/bcn-intermediate.pem \
            -noout \
            -subject \
            -issuer

          echo "=== Build CA bundle ==="

          cat \
            /etc/ssl/certs/ca-certificates.crt \
            /tmp/bcn-intermediate.pem \
            > /tmp/bcn-ca-bundle.pem

          echo "BCN SSL certificate configured successfully"

      # --------------------------------------------------------
      # Collect Exchange Rates
      # --------------------------------------------------------

      - name: Collect exchange rates
        run: python -m src.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BAC_API_URL: ${{ secrets.BAC_API_URL }}
          BCN_CA_BUNDLE: /tmp/bcn-ca-bundle.pem
