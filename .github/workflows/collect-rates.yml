
name: Collect exchange rates

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------------
      # Repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --------------------------------------------------------
      # BCN Certificate Validation (Temporary)
      # --------------------------------------------------------

      - name: Diagnose BCN certificate validation
        continue-on-error: true
        run: |
          echo "=== Download DigiCert intermediate ==="

          curl --fail --silent --show-error \
            --output /tmp/digicert-intermediate.crt \
            https://cacerts.digicert.com/DigiCertGlobalG2TLSRSASHA2562020CA1-1.crt

          echo "=== Inspect certificate ==="

          openssl x509 \
            -inform DER \
            -in /tmp/digicert-intermediate.crt \
            -noout \
            -subject \
            -issuer

          echo "=== Convert certificate to PEM ==="

          openssl x509 \
            -inform DER \
            -in /tmp/digicert-intermediate.crt \
            -out /tmp/digicert-intermediate.pem

          echo "=== Test BCN SSL connection ==="

          curl --verbose --max-time 20 \
            --cacert /tmp/digicert-intermediate.pem \
            https://servicios.bcn.gob.ni/Tc_Servicio/ServicioTC.asmx \
            --output /dev/null

      # --------------------------------------------------------
      # Collect Exchange Rates
      # --------------------------------------------------------

      - name: Collect exchange rates
        run: python -m src.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BAC_API_URL: ${{ secrets.BAC_API_URL }}
