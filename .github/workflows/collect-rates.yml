
name: Collect exchange rates

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------------
      # Repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --------------------------------------------------------
      # BCN Certificate Chain Diagnostics (Temporary)
      # --------------------------------------------------------

      - name: Diagnose BCN certificate chain
        continue-on-error: true
        run: |
          echo "=== BCN Certificate Chain ==="

          openssl s_client \
            -connect servicios.bcn.gob.ni:443 \
            -servername servicios.bcn.gob.ni \
            -showcerts \
            </dev/null 2>&1 | grep -E \
            "Certificate chain|^[[:space:]]*[0-9]+ s:|^[[:space:]]*i:|Verify return code|verify error"

      # --------------------------------------------------------
      # Collect Exchange Rates
      # --------------------------------------------------------

      - name: Collect exchange rates
        run: python -m src.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BAC_API_URL: ${{ secrets.BAC_API_URL }}
